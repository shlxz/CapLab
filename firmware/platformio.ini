; Cardputer-Adv + M5Stack Cap CC1101 (U219) 专属固件
; Sub-GHz 学习/重放/频谱 + NFC 读卡
;
; 烧录：pio run -t upload    （设备需进入下载模式：关机 → 按住 G0 → 插 USB → 松开）

[platformio]
; Windows 版 xtensa ld 在含中文的路径下无法创建 firmware.map，
; 会报 "cannot open map file ... No such file or directory" 并链接失败。
; 把构建目录指到系统临时目录（纯 ASCII）即可绕开，源码目录仍可保留中文。
; 产物路径：<TEMP>/caplab-pio-build/cardputer-adv/firmware.bin
build_dir = ${sysenv.TEMP}/caplab-pio-build

[env:cardputer-adv]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = direct

board_upload.flash_size = 8MB
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -O2
    -DESP32S3
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_RUNNING_CORE=1

lib_deps =
    m5stack/M5GFX@0.3.0
    m5stack/M5Unified@0.3.0
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Utility@0.3.1
    m5stack/M5HAL@0.1.4
    m5stack/M5UnitUnified@0.6.5
    m5stack/M5Unit-NFC@0.1.2
